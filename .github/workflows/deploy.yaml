name: Deploy PolyAI

on:
  push:
    branches: [main, dev]

jobs:
  deploy-dev:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Dev instance
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEV_INSTANCE_IP }}
          username: ubuntu
          key: ${{ secrets.DEV_INSTANCE_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/PolyAI
            git fetch origin
            git reset --hard origin/dev
            AGENT_URL=http://dev.tamer.fursa.click:8000 docker compose up -d --build

  deploy-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Prod instance
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_INSTANCE_IP }}
          username: ubuntu
          key: ${{ secrets.PROD_INSTANCE_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd /home/ubuntu/PolyAI
            git fetch origin
            git reset --hard origin/main

            sudo systemctl disable --now yolo.service agent.service frontend.service || true

            AGENT_URL=http://prod.tamer.fursa.click:8000 docker compose pull prometheus grafana
            AGENT_URL=http://prod.tamer.fursa.click:8000 docker compose up -d --build
