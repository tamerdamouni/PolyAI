name: Deploy YOLO

on:
  push:
    branches: [dev, main]
    paths:
      - "services/yolo/**"
      - ".github/workflows/deploy-yolo.yaml"

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/polyai-yolo
  IMAGE_TAG: ${{ github.ref_name }}-${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push yolo image
        uses: docker/build-push-action@v6
        with:
          context: ./services/yolo
          push: true
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Compose and config dirs only, never source code. The loop skips config
      # dirs that don't exist on this branch, so one workflow serves dev + main.
      - name: Assemble deploy bundle
        run: |
          mkdir -p bundle
          cp docker-compose.yml bundle/
          for d in services/prometheus services/grafana; do
            if [ -d "$d" ]; then
              mkdir -p "bundle/$d"
              cp -r "$d/." "bundle/$d/"
            fi
          done
          tar -czf bundle.tar.gz -C bundle .

      - name: Copy deploy bundle to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ github.ref_name == 'main' && secrets.PROD_INSTANCE_IP || secrets.DEV_INSTANCE_IP }}
          username: ubuntu
          key: ${{ github.ref_name == 'main' && secrets.PROD_INSTANCE_SSH_KEY || secrets.DEV_INSTANCE_SSH_KEY }}
          source: "bundle.tar.gz"
          target: /home/ubuntu/polyai

      - name: Redeploy yolo
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ github.ref_name == 'main' && secrets.PROD_INSTANCE_IP || secrets.DEV_INSTANCE_IP }}
          username: ubuntu
          key: ${{ github.ref_name == 'main' && secrets.PROD_INSTANCE_SSH_KEY || secrets.DEV_INSTANCE_SSH_KEY }}
          command_timeout: 30m
          envs: IMAGE_TAG,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          script: |
            set -e
            cd /home/ubuntu/polyai
            tar -xzf bundle.tar.gz && rm bundle.tar.gz
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            touch .env
            upsert() {
              if grep -q "^$1=" .env; then
                sed -i "s|^$1=.*|$1=$2|" .env
              else
                echo "$1=$2" >> .env
              fi
            }
            upsert DOCKERHUB_USERNAME "$DOCKERHUB_USERNAME"
            upsert YOLO_IMAGE_TAG "$IMAGE_TAG"
            docker compose pull yolo
            docker compose up -d --no-deps yolo
            # Reclaim disk: each deploy pulls a new tag. Keep 24h so a tag
            # rollback via .env still works.
            docker image prune -af --filter "until=24h"
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
