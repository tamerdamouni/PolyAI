networks:
  polyai-net:
    driver: bridge
  monitoring-net:
    driver: bridge

services:
  frontend:
    image: ${DOCKERHUB_USERNAME:-polyai}/polyai-frontend:${FRONTEND_IMAGE_TAG:-local}
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - polyai-net
    depends_on:
      - agent

  agent:
    image: ${DOCKERHUB_USERNAME:-polyai}/polyai-agent:${AGENT_IMAGE_TAG:-local}
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./services/agent/.env
    environment:
      YOLO_SERVICE_URL: http://yolo:8080
      IMG_PROC_MCP_URL: http://img-proc-mcp:9000/mcp
    networks:
      - polyai-net
    depends_on:
      - yolo
      - img-proc-mcp

  img-proc-mcp:
    image: ${DOCKERHUB_USERNAME:-polyai}/polyai-img-proc-mcp:${IMG_PROC_MCP_IMAGE_TAG:-local}
    restart: unless-stopped
    ports:
      - "9000:9000"
    env_file:
      - ./services/img-proc-mcp/.env
    networks:
      - polyai-net

  yolo:
    image: ${DOCKERHUB_USERNAME:-polyai}/polyai-yolo:${YOLO_IMAGE_TAG:-local}
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ./services/yolo/.env
    networks:
      - polyai-net

  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./services/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - monitoring-net
      - polyai-net

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - monitoring-net

volumes:
  prometheus-data:
  grafana-data:
