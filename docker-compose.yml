networks:
  polyai-net:
    driver: bridge
  monitoring-net:
    driver: bridge

services:
  frontend:
    build:
      context: ./services/frontend
      args:
        NEXT_PUBLIC_AGENT_URL: ${AGENT_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    networks:
      - polyai-net
    depends_on:
      - agent

  agent:
    build: ./services/agent
    ports:
      - "8000:8000"
    env_file:
      - ./services/agent/.env
    environment:
      YOLO_SERVICE_URL: http://yolo:8080
    networks:
      - polyai-net
    depends_on:
      - yolo

  yolo:
    build: ./services/yolo
    ports:
      - "8080:8080"
    env_file:
      - ./services/yolo/.env
    networks:
      - polyai-net

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./services/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - monitoring-net
      - polyai-net

  node-exporter:
    image: prom/node-exporter
    command:
      - '--path.rootfs=/host'
    pid: host
    volumes:
      - /:/host:ro
    ports:
      - "9100:9100"
    networks:
      - monitoring-net

  grafana:
    image: grafana/grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./services/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./services/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - monitoring-net

volumes:
  prometheus-data:
  grafana-data:
