networks:
  polyai-net:
    driver: bridge
  monitoring-net:
    driver: bridge

services:
  frontend:
    image: ${DOCKERHUB_USERNAME:-polyai}/polyai-frontend:${FRONTEND_IMAGE_TAG:-local}
    build:
      context: ./services/frontend
      args:
        NEXT_PUBLIC_AGENT_URL: ${AGENT_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    networks:
      - polyai-net
    depends_on:
      - agent

  agent:
    image: ${DOCKERHUB_USERNAME:-polyai}/polyai-agent:${AGENT_IMAGE_TAG:-local}
    build: ./services/agent
    ports:
      - "8000:8000"
    env_file:
      - ./services/agent/.env
    environment:
      YOLO_SERVICE_URL: http://yolo:8080
    networks:
      - polyai-net
    depends_on:
      - yolo

  yolo:
    image: ${DOCKERHUB_USERNAME:-polyai}/polyai-yolo:${YOLO_IMAGE_TAG:-local}
    build: ./services/yolo
    ports:
      - "8080:8080"
    env_file:
      - ./services/yolo/.env
    networks:
      - polyai-net

  prometheus:
    image: prom/prometheus:v3.1.0
    ports:
      - "9090:9090"
    volumes:
      - ./services/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - monitoring-net
      - polyai-net

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - monitoring-net

volumes:
  prometheus-data:
  grafana-data:
